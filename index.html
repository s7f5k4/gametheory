<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Казино на $100</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#10141a; --line:#262c36; --text:#e8ecf2; --muted:#8b95a5;
    --up:#3ddc84; --down:#ff5d5d; --gold:#3ddc84; --blue:#4ea1ff; --felt:#0f5a3a;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1a2230 0,var(--bg) 60%) fixed;
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* ---- шапка ---- */
  header.top{border-bottom:1px solid var(--line);background:rgba(23,27,34,.82);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
  .topin{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:900;font-size:20px;letter-spacing:.02em}
  .brand span{color:var(--gold)}
  nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  nav a{
    color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid transparent;
  }
  nav a:hover{color:var(--text);background:var(--panel2)}
  nav a.on{color:#052b14;background:var(--gold)}
  .bank{text-align:right;min-width:170px}
  #bal{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;word-break:break-all;transition:color .25s}
  #bal.up{color:var(--up)} #bal.down{color:var(--down)}
  #esc{font-size:12px;color:var(--muted);min-height:16px}
  #sfx,#newgame{margin-left:6px;font-size:12px;padding:6px 10px;border-radius:8px;background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:700;cursor:pointer}
  #sfx:hover,#newgame:hover{color:var(--text)}
  #broke{display:none;background:#3a1518;border-bottom:1px solid #6b2328;color:#ffb3b3;text-align:center;padding:10px;font-weight:700}
  #broke button{margin-left:10px}

  /* ---- общее ---- */
  .page{display:none;flex:1;padding:16px;max-width:1240px;width:100%;margin:0 auto}
  .page.on{display:block}
  .grid3{display:grid;grid-template-columns:260px 1fr 330px;gap:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
  .stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .stat:last-child{border-bottom:0}
  .stat b{font-size:15px;font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
  .bigcount{font-size:44px;font-weight:800;text-align:center;margin:6px 0 10px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .center{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
  .rules{display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:center}
  .rules span{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .rules .p,.up{color:var(--up)} .rules .m,.dn{color:var(--down)}
  .msg{min-height:26px;font-size:19px;font-weight:700;text-align:center}
  .hint{font-size:12px;color:var(--muted);text-align:center}
  h2.ptitle{font-size:22px;margin-bottom:12px}

  button{
    font:inherit;font-weight:800;font-size:17px;padding:13px 32px;border-radius:12px;border:0;cursor:pointer;
    background:var(--gold);color:#052b14;box-shadow:0 6px 0 #1f9c57;transition:transform .08s,box-shadow .08s,opacity .2s;
  }
  button:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #1f9c57}
  button:disabled{opacity:.5;cursor:default}
  button.sec{background:#2b3442;color:var(--text);box-shadow:0 4px 0 #1a212c;font-size:14px;padding:10px 16px}
  button.sec:active:not(:disabled){box-shadow:0 1px 0 #1a212c}
  button.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);font-size:13px;padding:8px 14px;font-weight:600}
  button.green{background:var(--up);color:#052b14;box-shadow:0 6px 0 #1f9c57}
  button.red{background:var(--down);color:#310606;box-shadow:0 6px 0 #a03636}
  .field{display:flex;flex-direction:column;gap:5px}
  input[type=number],select{
    font:inherit;font-size:16px;font-weight:600;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-variant-numeric:tabular-nums;width:100%;
  }
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
  .row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  .quick{display:flex;gap:6px}
  .quick button{flex:1;font-size:12px;padding:6px 0;border-radius:8px;background:#2b3442;color:var(--text);box-shadow:none;font-weight:600}
  .ctl{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
  .ctl2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .hist{list-style:none;padding:0;max-height:600px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .hist li{
    display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;
    background:var(--panel2);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums;animation:in .25s ease-out;
  }
  .hist li.sum{grid-template-columns:1fr;border-color:var(--gold)}
  .hist .n{color:var(--muted);font-size:12px}
  .hist .t{font-weight:700} .hist .t.u{color:var(--up)} .hist .t.d{color:var(--down)}
  .hist .b{color:var(--muted);text-align:right;word-break:break-all;font-size:12.5px}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 0}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---- монета ---- */
  .scene{width:200px;height:200px;perspective:900px}
  .coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
  .face{
    position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;
    border:6px solid #b8860b;box-shadow:inset 0 0 0 5px rgba(255,255,255,.25),inset 0 -12px 28px rgba(0,0,0,.28),0 14px 30px rgba(0,0,0,.45);
  }
  .face::before{content:"";position:absolute;inset:14px;border-radius:50%;border:3px dashed rgba(120,80,0,.55)}
  .face.h{background:radial-gradient(circle at 32% 28%,#fff1b0,#f5c542 45%,#c9961a 100%)}
  .face.t{background:radial-gradient(circle at 32% 28%,#f0f3f7,#bcc5d1 45%,#8793a3 100%);border-color:#6b7787;transform:rotateY(180deg)}
  .face .sym{font-size:58px;font-weight:900;line-height:1;color:rgba(90,58,0,.85);text-shadow:0 2px 0 rgba(255,255,255,.45)}
  .face.t .sym{color:rgba(40,50,64,.85)}
  .face .sym.long{font-size:44px;letter-spacing:-.02em}
  .face .cap{font-size:13px;font-weight:800;letter-spacing:.16em;margin-top:6px;color:rgba(90,58,0,.8)}
  .face.t .cap{color:rgba(40,50,64,.8)}
  .shadow{width:130px;height:14px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(8px);margin-top:-8px;transition:transform .8s,opacity .8s}
  .scene.flying + .shadow{transform:scale(.6);opacity:.35}

  /* ---- краш ---- */
  #strip{display:flex;gap:6px;overflow:hidden;height:30px;width:100%}
  #strip span{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
  .lo{color:var(--down)} .mid{color:var(--blue)} .hi{color:var(--gold)}
  .stage{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;width:100%}
  canvas{display:block;width:100%}
  #cr-cv{height:320px}
  #cr-mult{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:66px;font-weight:900;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 4px 24px rgba(0,0,0,.6)}
  #cr-mult small{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  #cr-mult.run{color:var(--text)} #cr-mult.crash{color:var(--down)} #cr-mult.won{color:var(--up)}

  /* ---- рулетка ---- */
  .rl-top{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
  #rl-wheel{width:260px;height:260px}
  #rl-num{font-size:64px;font-weight:900;width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:6px solid var(--line);background:var(--panel2)}
  .rl-red{background:#c4262e !important;color:#fff} .rl-black{background:#1c1f26 !important;color:#fff} .rl-green{background:#12803f !important;color:#fff}
  #rl-table{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));grid-template-rows:repeat(3,44px) 44px 44px;gap:3px;width:100%;max-width:760px;user-select:none}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border-radius:6px;cursor:pointer;border:1px solid rgba(255,255,255,.18);color:#fff;transition:filter .1s}
  .cell:hover{filter:brightness(1.25)}
  .cell.r{background:#c4262e} .cell.b{background:#1c1f26} .cell.g{background:#12803f} .cell.o{background:#202733;font-size:12px;color:#d6dbe5}
  .cell .chip{position:absolute;right:2px;bottom:2px;min-width:20px;height:20px;padding:0 4px;border-radius:999px;background:var(--gold);color:#052b14;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px dashed rgba(0,0,0,.35)}
  .cell.win{outline:3px solid var(--gold);outline-offset:-3px;animation:pulse .6s ease-in-out 4}
  @keyframes pulse{50%{filter:brightness(1.7)}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chipb{width:52px;height:52px;border-radius:50%;padding:0;font-size:14px;font-weight:900;background:#2b3442;color:var(--text);box-shadow:0 4px 0 #1a212c;border:3px dashed rgba(255,255,255,.35)}
  .chipb.sel{background:var(--gold);color:#052b14;box-shadow:0 4px 0 #1f9c57}

  /* ---- покер ---- */
  .felt{
    background:radial-gradient(ellipse at 50% 40%,#17855a 0,var(--felt) 70%);border:10px solid #3a2a18;border-radius:140px/90px;
    padding:22px 20px;width:100%;max-width:820px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:430px;
    box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.5);
  }
  .seat{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px}
  .seat .nm{font-size:13px;font-weight:800;color:#e9fff3;display:flex;gap:8px;align-items:center}
  .seat .stk{background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
  .dbtn{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#fff;color:#000;font-size:11px;font-weight:900;align-items:center;justify-content:center}
  .cards{display:flex;gap:8px;min-height:84px}
  .card{
    width:58px;height:84px;border-radius:8px;background:#fafafa;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:900;font-size:24px;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.45);position:relative;
  }
  .card small{font-size:26px;margin-top:2px}
  .card.red{color:#c4262e}
  .card.back{background:repeating-linear-gradient(45deg,#2c4aa8 0 6px,#233c8a 6px 12px);border:3px solid #fafafa}
  .card.empty{background:rgba(0,0,0,.18);box-shadow:none;border:2px dashed rgba(255,255,255,.2)}
  .card.hl{outline:3px solid var(--gold)}
  .potline{font-weight:800;color:#fff7d6;font-size:17px;background:rgba(0,0,0,.35);padding:4px 16px;border-radius:999px;font-variant-numeric:tabular-nums}
  .betline{font-size:13px;color:#d6ffe9;min-height:18px}
  #pk-status{min-height:26px;font-weight:700;font-size:16px;text-align:center}
  .pk-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
  .pk-act button{padding:12px 22px;font-size:16px}
  #pk-raise-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%;max-width:560px}
  #pk-raise-box input[type=range]{flex:1;min-width:150px;accent-color:var(--gold)}
  #pk-raise-box input[type=number]{width:110px}
  #pk-log{list-style:none;padding:0;max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
  #pk-log li{padding:5px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
  #pk-log li.sys{color:var(--gold);font-weight:700}

  @media (max-width:980px){
    .grid3{grid-template-columns:1fr}
    .grid3 > .center{order:-1}
    .hist{max-height:300px}
    .felt{border-radius:60px/40px;padding:14px 8px}
    .card{width:48px;height:70px;font-size:20px}
    #cr-mult{font-size:48px}
    .bank{min-width:0;text-align:left}
  }

  button,a,.cell{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  @media (max-width:640px){
    .topin{padding:8px 10px;gap:8px}
    .brand{font-size:17px;order:1}
    .bank{order:2;margin-left:auto;min-width:0;text-align:right}
    #newgame,#sfx{order:3;margin-left:0}
    nav{order:4;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav a{white-space:nowrap;padding:8px 12px;font-size:13px}
    #bal{font-size:22px}
    .page{padding:10px}
    h2.ptitle{font-size:18px;margin-bottom:8px}
    .grid3{gap:10px}
    .panel{padding:12px}
    .bigcount{font-size:34px}
    .msg{font-size:16px}
    button{font-size:16px;padding:12px 20px}
    .ctl2{grid-template-columns:1fr}
    .ctl{max-width:none}
    .scene{width:150px;height:150px}
    .face .sym{font-size:42px} .face .sym.long{font-size:32px} .face .cap{font-size:11px}
    .shadow{width:100px}
    #cr-cv{height:240px}
    #cr-mult{font-size:42px}
    .hist{max-height:240px}
    #rl-wheel{width:210px;height:210px}
    #rl-num{width:90px;height:90px;font-size:42px;border-width:4px}
    .rl-top{gap:12px}
    #rl-table{grid-template-rows:repeat(3,38px) 38px 38px;gap:2px}
    .cell{font-size:11px;border-radius:4px} .cell.o{font-size:10px}
    .cell .chip{min-width:16px;height:16px;font-size:9px}
    .chipb{width:44px;height:44px;font-size:12px}
    .felt{padding:12px 6px;gap:10px;min-height:0;border-width:6px}
    #pk-bots{gap:8px}
    #pk-bots .seat{min-width:76px}
    #pk-bots .card{width:34px;height:50px;font-size:14px} #pk-bots .card small{font-size:14px}
    #pk-bots .cards{min-height:50px}
    .card{width:44px;height:64px;font-size:19px} .card small{font-size:20px}
    .cards{gap:5px;min-height:64px}
    .pk-act button{padding:12px 16px;font-size:15px}
    #pk-raise-box input[type=number]{width:96px}
    #pk-log{max-height:220px}
    .potline{font-size:15px}
  }

/* ===== v2: адаптивность и пропорции ===== */
body{min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
header.top{padding-top:env(safe-area-inset-top)}
.page{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
@media (min-width:981px){
  .page{padding:26px 24px 40px}
  .grid3{grid-template-columns:230px minmax(0,1fr) 290px;gap:22px;align-items:start}
  .grid3 > .panel{position:sticky;top:84px}
  .hist{max-height:calc(100vh - 230px)}
  h2.ptitle{font-size:26px;margin-bottom:16px}
  .ctl{max-width:480px}
  .scene{width:220px;height:220px}
  .stage{max-width:760px}
  #cr-cv{height:340px}
  .felt{max-width:760px}
}
@media (min-width:1500px){
  .topin,.page{max-width:1320px}
}
@media (max-width:980px){
  .grid3 > .panel{position:static}
  .page{max-width:720px}
}
@media (max-width:640px){
  header.top{backdrop-filter:blur(8px)}
  .topin{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px}
  .brand{display:none}
  .bank{order:1;min-width:0;text-align:left;margin-right:auto}
  .bank .label{display:none}
  #bal{font-size:21px}
  #esc{min-height:0;font-size:11px}
  #sfx,#newgame{order:2;margin:0;padding:7px 11px;font-size:12px;min-height:36px;box-shadow:none;transform:none}
  nav{order:4;flex:1 0 100%;margin:0 -12px;padding:2px 12px 4px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav a{flex:0 0 auto;padding:9px 14px;font-size:14px;border-color:var(--line)}
  nav a.on{border-color:var(--gold)}
  .page{padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
  h2.ptitle{font-size:19px;line-height:1.25;margin-bottom:10px}
  .grid3{gap:12px}
  .panel{padding:14px;border-radius:12px}
  .center{gap:14px}
  .ctl{max-width:none;gap:14px}
  .ctl2{grid-template-columns:1fr;gap:12px}
  input[type=number],select{padding:12px;min-height:46px}
  button{min-height:48px}
  button.sec,button.ghost{min-height:42px}
  .quick{overflow-x:auto;flex-wrap:nowrap;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .quick button{flex:0 0 auto;min-width:54px;min-height:38px;padding:8px 12px;font-size:13px}
  .scene{width:170px;height:170px}
  .rules{gap:6px;font-size:12px}
  .rules span{padding:5px 9px}
  .msg{font-size:17px}
  .stat{font-size:13px;padding:8px 0}
  #cr-cv{height:260px}
  #strip{height:32px}
  #rl-table{grid-template-rows:repeat(3,42px) 42px 42px}
  .chipb{width:46px;height:46px;min-height:0}
  .pk-act{gap:8px;width:100%}
  .pk-act button{flex:1 1 0;min-width:0;padding:12px 10px}
  .hist li{grid-template-columns:48px 1fr auto;padding:8px}
}
@media (max-width:380px){
  .brand{font-size:15px}
  #bal{font-size:19px}
  .ctl2{grid-template-columns:1fr}
}</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">Казино <span>$100</span></div>
    <nav id="nav">
      <a href="#coin" data-p="coin">Коинфлип</a>
      <a href="#x2" data-p="x2">Коинфлип ×2</a>
      <a href="#crash" data-p="crash">Краш</a>
      <a href="#roulette" data-p="roulette">Рулетка</a>
      <a href="#poker" data-p="poker">Покер</a>
    </nav>
    <div class="bank">
      <div class="label">Баланс (виртуальные деньги)</div>
      <div id="bal">$100.00</div>
      <div id="esc"></div>
    </div>
    <button id="sfx" title="Звуковые эффекты">Звук: вкл</button>
    <button id="newgame" title="Начать заново с $100">Новая игра</button>
  </div>
  <div id="broke">Деньги кончились. <button class="sec" id="broke-btn">Начать заново с $100</button></div>
</header>

<main id="pages">
  <section class="page" id="pg-coin"></section>
  <section class="page" id="pg-x2"></section>
  <section class="page" id="pg-crash"></section>
  <section class="page" id="pg-roulette"></section>
  <section class="page" id="pg-poker"></section>

  function buildBuy() {
    let buy = Math.floor(Number(G('buy').value) * 100) / 100; const bal = Math.floor(Bank.bal * 100) / 100;
    if (!isFinite(buy) || buy < 1) buy = Math.min(1, bal); if (buy > bal) buy = bal;
    const bb = Number(G('bb').value);
    if (buy < 1) { status('Нужно минимум $1 на балансе.', 'var(--down)'); return null; }
    if (buy < bb * 5) { status('Бай-ин должен быть минимум 5 больших блайндов.', 'var(--down)'); return null; }
    return { buy, bb };
  }
  function startGame() {
    if (S || role === 'guest') return;
    const b = buildBuy(); if (!b) return;
    const bots = [], taken = new Set([role === 'host' ? myName() : 'Вы', ...remotes.map(r => r.name)]);
    botCfg.slice(0, Number(G('nb').value)).forEach((c, i) => { let nm = (c.name || '').trim().slice(0, 14) || 'Бот ' + (i + 1), base = nm, k = 2; while (taken.has(nm)) nm = base + ' ' + k++; taken.add(nm); const ks = Object.keys(STYLES); bots.push({ name: nm, kind: 'bot', level: c.level, style: c.style && c.style !== 'auto' ? c.style : ks[randInt(ks.length)] }); });
    if (!bots.length && !remotes.length) { status('Добавьте хотя бы одного бота или дождитесь друга.', 'var(--down)'); return; }
    G('buy').value = b.buy; Bank.add(-b.buy); Bank.escrow = b.buy; try { localStorage.setItem(TKEY, String(b.buy)); } catch (e) {}
    const launch = () => {
      const P = [{ name: role === 'host' ? myName() : 'Вы', kind: 'host', stack: b.buy }];
      remotes.forEach(r => { r.seat = -1; if (r.stack >= 1) { r.seat = P.length; P.push({ name: r.name, kind: 'remote', stack: r.stack, conn: r.conn }); } else send(r.conn, { t: 'nope', msg: 'Недостаточно денег для бай-ина.' }); });
      bots.forEach(x => P.push(Object.assign({}, x, { stack: b.buy })));
      P.forEach(p => { p.net = 0; p.w = 0; p.l = 0; p.tilt = 0; });
      if (P.length < 2) { cashOut(); status('Никто не сел за стол.', 'var(--down)'); return; }
      S = { P, init: b.buy, bb: b.bb, sb: b.bb / 2, dealer: randInt(P.length), hands: 0, big: 0, stats: {} };
      oppStat.fa = oppStat.fn = 0; G('log').innerHTML = '';
      log('Стили ботов: ' + P.filter(p => p.kind === 'bot').map(p => p.name + ' — ' + STYLES[p.style].name).join('; '), true);
      log('Стол: бай-ин ' + money(b.buy) + ', блайнды ' + money(S.sb) + '/' + money(b.bb) + '; игроки: ' + P.map(p => p.name).join(', '), true);
      syncBank(); newHand();
    };
    if (!remotes.length) { launch(); return; }
    remotes.forEach(r => { r.stack = -1; send(r.conn, { t: 'sit', buy: b.buy, bb: b.bb }); });
    status('Ждём подтверждения игроков…');
    seatWait = setTimeout(() => { seatWait = null; remotes.forEach(r => { if (r.stack < 0) r.stack = 0; }); launch(); }, 6000);
    remotes.forEach(r => { r.check = () => { if (remotes.every(x => x.stack >= 0) && seatWait) { clearTimeout(seatWait); seatWait = null; launch(); } }; });
  }

  /* ---------- сеть ---------- */
  function lobbyRefresh() {
    const box = G('lobby'); const names = [(role === 'host' ? myName() : lobbyNames[0] || '')].concat(role === 'host' ? remotes.map(r => r.name) : lobbyNames.slice(1));
    const online = role !== 'solo';
    G('onl').style.display = online ? 'none' : 'block'; box.style.display = online ? 'block' : 'none';
    G('cfg').style.display = role === 'guest' ? 'none' : 'block'; G('exitroom').style.display = online ? 'block' : 'none';
    G('sit').textContent = role === 'host' ? 'Начать игру' : 'Сесть за стол';
    if (role === 'host') box.innerHTML = 'Код стола: <b class="code" id="pk-codeshow">' + hostCode + '</b><br>Игроки: ' + names.join(', ') + '<br><span style="color:var(--muted);font-size:12px">Передайте код другу: он вводит его в «Войти». Можно добавить и ботов.</span>';
    else if (role === 'guest') box.innerHTML = 'Вы в комнате.<br>Игроки: ' + names.join(', ') + '<br><span style="color:var(--muted);font-size:12px">Ждём, пока хозяин начнёт игру.</span>';
  }
  let hostCode = '';
  function newCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += a[randInt(a.length)]; return s; }
  function createHost(tries) {
    if (!PeerCls()) { status('Не удалось загрузить сетевой модуль.', 'var(--down)'); return; }
    hostCode = newCode(); status('Создаём стол…');
    const pr = new (PeerCls())('pkr' + hostCode);
    pr.on('open', () => { peer = pr; role = 'host'; remotes = []; status('Стол создан. Отправьте код другу: ' + hostCode); lobbyRefresh(); });
    pr.on('error', e => { if (e.type === 'unavailable-id' && (tries || 0) < 4) { try { pr.destroy(); } catch (x) {} createHost((tries || 0) + 1); } else { status('Ошибка сети: ' + (e.type || e) + '. Проверьте интернет.', 'var(--down)'); } });
    pr.on('connection', conn => {
      const rec = { conn, name: 'Игрок', seat: -1, stack: 0 };
      conn.on('data', m => onHostMsg(rec, m));
      conn.on('close', () => hostDrop(rec));
      conn.on('error', () => hostDrop(rec));
    });
  }
  function hostDrop(rec) {
    const idx = remotes.indexOf(rec); if (idx < 0) return;
    if (S && rec.seat >= 0) {
      const p = S.P[rec.seat]; if (p && !p.out) {
        p.out = true; log(p.name + ' отключился', true);
        if (H && !H.over) {
          const wasTurn = H.to === rec.seat; p.folded = true;
          if (live().length <= 1) { remotes.splice(idx, 1); showdownOrWin(); return; }
          if (wasTurn) { H.to = rec.seat; p.folded = false; remotes.splice(idx, 1); apply(rec.seat, 'fold'); return; }
          if (nextNeed(0) < 0 && H.to >= 0) { /* раунд мог завершиться */ }
        }
      }
    }
    remotes.splice(idx, 1); broadcastLobby(); lobbyRefresh();
    if (S && S.P.filter(p => !p.out).length < 2 && (!H || H.over)) endTable('Все соперники ушли.');
  }
  function broadcastLobby() { const names = [myName()].concat(remotes.map(r => r.name)); remotes.forEach(r => send(r.conn, { t: 'lobby', names })); }
  function onHostMsg(rec, m) {
    if (!m || !m.t) return;
    if (m.t === 'join') {
      if (S) { send(rec.conn, { t: 'nope', msg: 'Игра уже идёт, подождите конца.' }); return; }
      let nm = String(m.name || 'Игрок').slice(0, 14), base = nm, k = 2; const taken = () => nm === myName() || remotes.some(r => r !== rec && r.name === nm);
      while (taken()) nm = base + k++;
      rec.name = nm; if (!remotes.includes(rec)) { if (remotes.length >= 5) { send(rec.conn, { t: 'nope', msg: 'Стол заполнен.' }); return; } remotes.push(rec); }
      broadcastLobby(); lobbyRefresh();
    } else if (m.t === 'seat') { rec.stack = Math.max(0, Number(m.stack) || 0); if (rec.check) rec.check(); }
    else if (m.t === 'act') { if (S && H && !H.over && rec.seat >= 0 && H.to === rec.seat && ['fold', 'call', 'raise'].includes(m.a)) apply(rec.seat, m.a, m.to); }
    else if (m.t === 'leave') { if (S && rec.seat >= 0 && S.P[rec.seat]) { S.P[rec.seat].out = true; log(S.P[rec.seat].name + ' ушёл из-за стола', true); } const i = remotes.indexOf(rec); if (i >= 0) remotes.splice(i, 1); broadcastLobby(); lobbyRefresh(); if (S && H && H.over && S.P.filter(p => !p.out).length < 2) endTable('Все соперники ушли.'); }
  }
  function joinRoom() {
    const code = G('code').value.trim().toUpperCase(); if (code.length < 4) { status('Введите код стола.', 'var(--down)'); return; }
    if (!PeerCls()) { status('Не удалось загрузить сетевой модуль.', 'var(--down)'); return; }
    status('Подключаемся…'); const pr = new (PeerCls())();
    pr.on('open', () => {
      const c = pr.connect('pkr' + code, { reliable: true });
      let opened = false; const to = setTimeout(() => { if (!opened) { status('Не удалось подключиться. Проверьте код и интернет.', 'var(--down)'); try { pr.destroy(); } catch (e) {} } }, 12000);
      c.on('open', () => { opened = true; clearTimeout(to); peer = pr; hostConn = c; role = 'guest'; lobbyNames = []; status('Подключено. Ждём хозяина…'); lobbyRefresh(); send(c, { t: 'join', name: myName() }); });
      c.on('data', onGuestMsg);
      c.on('close', () => guestClosed('Хозяин закрыл соединение.'));
      c.on('error', () => guestClosed('Ошибка соединения.'));
    });
    pr.on('error', e => { status(e.type === 'peer-unavailable' ? 'Стол с таким кодом не найден.' : 'Ошибка сети: ' + (e.type || e), 'var(--down)'); });
  }
  function guestCash() { const me = V && V.players[V.me]; const back = me ? me.stack : 0; Bank.escrow = 0; if (back > 0) Bank.add(back); else Bank.render(0); try { localStorage.removeItem(TKEY); } catch (e) {} V = null; }
  function guestClosed(msg) { if (role !== 'guest') return; guestCash(); toSolo(msg); }
  function toSolo(msg) {
    clearTimeout(timer); clearTimeout(nextTimer);
    try { if (peer) peer.destroy(); } catch (e) {} peer = null; hostConn = null; remotes = []; role = 'solo'; lobbyNames = []; V = null;
    resetTableUi(); lobbyRefresh(); status(msg || 'Выберите количество ботов или создайте онлайн-стол.');
  }
  function onGuestMsg(m) {
    if (!m || !m.t) return;
    if (m.t === 'lobby') { lobbyNames = m.names; lobbyRefresh(); }
    else if (m.t === 'sit') {
      const stack = Math.min(m.buy, Math.floor(Bank.bal * 100) / 100);
      if (stack < 1 || stack < m.bb * 5) { send(hostConn, { t: 'seat', stack: 0 }); status('Недостаточно денег для бай-ина.', 'var(--down)'); return; }
      Bank.add(-stack); Bank.escrow = stack; try { localStorage.setItem(TKEY, String(stack)); } catch (e) {}
      G('log').innerHTML = ''; send(hostConn, { t: 'seat', stack });
    }
    else if (m.t === 'view') { V = m.v; renderView(V); }
    else if (m.t === 'log') log(m.text, m.sys, true);
    else if (m.t === 'nope') { status(m.msg || 'Отказано.', 'var(--down)'); }
    else if (m.t === 'busted') { const msg = 'Вы проиграли весь стек.'; Bank.escrow = 0; try { localStorage.removeItem(TKEY); } catch (e) {} V = null; Bank.render(0); toSolo(msg); status(msg, 'var(--down)'); }
    else if (m.t === 'end') { guestCash(); resetTableUi(); status(m.msg || 'Стол закрыт.'); lobbyRefresh(); }
  }

  /* ---------- кнопки ---------- */
  G('sit').addEventListener('click', startGame);
  G('host').addEventListener('click', () => createHost(0));
  G('join').addEventListener('click', joinRoom);
  G('exitroom').addEventListener('click', () => {
    if (role === 'guest') { send(hostConn, { t: 'leave' }); toSolo('Вы вышли из комнаты.'); }
    else if (role === 'host') { remotes.forEach(r => send(r.conn, { t: 'end', msg: 'Хозяин закрыл стол.' })); toSolo('Стол закрыт.'); }
  });
  G('leave').addEventListener('click', () => {
    if (role === 'guest') { if (V && !V.over) { status('Доиграйте текущую раздачу.', 'var(--down)'); return; } send(hostConn, { t: 'leave' }); guestCash(); toSolo('Вы встали из-за стола.'); return; }
    if (!S) return; if (H && !H.over) { status('Доиграйте текущую раздачу.', 'var(--down)'); return; }
    endTable(role === 'host' ? 'Хозяин встал из-за стола, стол закрыт.' : 'Вы встали из-за стола.');
  });
  G('next').addEventListener('click', () => { if (S && H && H.over) newHand(); });
  const act = (a, to) => {
    if (role === 'guest') { if (V && V.legal) send(hostConn, { t: 'act', a, to }); return; }
    if (H && !H.over && H.to === 0) apply(0, a, to);
  };
  G('fold').addEventListener('click', () => act('fold'));
  G('call').addEventListener('click', () => act('call'));
  G('raise').addEventListener('click', () => act('raise', Number(G('rv').value)));
  const rl = v => ((V && V.maxBet > 0) ? 'Рейз до ' : 'Бет ') + money(v);
  G('sl').addEventListener('input', () => { G('rv').value = Number(G('sl').value).toFixed(2); G('raise').textContent = rl(Number(G('sl').value)); });
  G('rv').addEventListener('input', () => { if (!V || !V.legal) return; const L = V.legal; let v = Number(G('rv').value); if (isFinite(v)) { v = Math.min(L.maxTo, Math.max(L.minTo, v)); G('sl').value = v; G('raise').textContent = rl(v); } });
  root.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
    if (!V || !V.legal) return; const L = V.legal, f = b.dataset.f, pot = V.players.reduce((a, p) => a + p.contrib, 0);
    let v = f === 'all' ? L.maxTo : V.maxBet + Number(f) * (pot + L.toCall); v = r2(Math.min(L.maxTo, Math.max(L.minTo, v)));
    G('rv').value = v.toFixed(2); G('sl').value = v; G('raise').textContent = rl(v);
  }));
  Bank.onReset.push(() => { clearTimeout(timer); clearTimeout(nextTimer); try { localStorage.removeItem(TKEY); } catch (e) {} Bank.escrow = 0; if (S) { S = null; H = null; V = null; remotes.forEach(r => { send(r.conn, { t: 'end', msg: 'Хозяин начал игру заново.' }); r.seat = -1; }); } G('log').innerHTML = ''; resetTableUi(); status('Выберите количество ботов или создайте онлайн-стол.'); });
  window.addEventListener('beforeunload', () => { try { if (peer) peer.destroy(); } catch (e) {} });

  try { const t = Number(localStorage.getItem(TKEY)); if (isFinite(t) && t > 0) { Bank.bal = Math.min(BIG, Bank.bal + t); Bank.save(); } localStorage.removeItem(TKEY); } catch (e) {}
  window.__pk = { state: () => S, view: () => V, role: () => role, evalCards, equity, makeRange, decide, catOf, CATN };
  lobbyRefresh(); resetTableUi();
})();

/* ============ запуск ============ */
Bank.render(0); route();

</script></body></html>
